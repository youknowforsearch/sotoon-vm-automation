workspace: "WORKSPACE-UUID"
token: "TOKEN-WITH-Valid-Creds"

# Inherited by every group; any key can be overridden per group.
vars:
  region: thr1
  image: ubuntu-26.04
  network:
    vpc: default
    subnet: default
    public_ip: false
  user:
    name: ubuntu            # SSH is authenticated by Sotoon IAM (iam_ssh, default true)
  labels:
    env: staging

groups:

  kafka:
    name: kafka-internal
    count: 2                   # -> kafka-internal-01 .. kafka-internal-02
    type:
      group: general           # eco | general | compute | memory
      cores: 8
      os_disk: 480Gi           # total, must divide by cores -> g1d60-8
    labels:
      app: apache-kafka

